# Builds Blox Code for Windows (WPF exe) and Linux (AppImage), tests the AppImage on the distro
# families we support, and on a v* tag publishes both files as the GitHub release the updaters read.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Releases are signed through SignPath Foundation once the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist; until then, unsigned.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish BloxCode.exe
        run: dotnet publish windows/BloxCode.csproj -c Release -o dist
      - name: Version being released
        if: env.SIGN == 'true'
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Upload the unsigned exe for signing
        if: env.SIGN == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/BloxCode.exe
          if-no-files-found: error
      - name: Sign with SignPath (a maintainer approves each release on app.signpath.io)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'blox-code' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.value }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Use the signed exe
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature signed/BloxCode.exe
          if ($signature.Status -ne 'Valid') { throw "BloxCode.exe isn't validly signed: $($signature.Status) $($signature.StatusMessage)" }
          "Signed by $($signature.SignerCertificate.Subject)"
          Copy-Item signed/BloxCode.exe dist/BloxCode.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/BloxCode.exe
          if-no-files-found: error

  linux:
    # Built on the oldest supported base (Ubuntu 22.04) so the AppImage runs on everything newer.
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: '1'
    steps:
      - name: Build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl file git desktop-file-utils \
            xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 libxrandr2 libxi6 libxcursor1 libgl1 fonts-dejavu-core
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the AppImage
        run: bash linux/packaging/build-appimage.sh
      - name: Self-test (headless)
        run: APPIMAGE_EXTRACT_AND_RUN=1 dist/BloxCode-x86_64.AppImage --self-test
      - name: UI smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 xvfb-run -a dist/BloxCode-x86_64.AppImage --self-test --ui
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/BloxCode-x86_64.AppImage
          if-no-files-found: error

  distros:
    # The same AppImage on the newest Debian/Ubuntu and on Arch (CachyOS's base).
    needs: linux
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    # archlinux:latest changes every day and can break for reasons outside Blox Code (it exited 127,
    # "command not found", before Blox Code ran, on 2026-11-10); it still runs and shows, but doesn't
    # hold the release back. Debian and Ubuntu still must pass.
    continue-on-error: ${{ matrix.image == 'archlinux:latest' }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12', 'archlinux:latest']
    steps:
      # A desktop always has OpenSSL (HTTPS needs it); the minimal container images may not, and the
      # self-test hashes files, so ca-certificates/openssl come along.
      - name: Display and system libraries for the tests
        run: |
          if command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed openssl xorg-server-xvfb xorg-xauth libx11 libice libsm fontconfig libxrandr libxi libxcursor mesa ttf-dejavu
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates openssl xvfb xauth libx11-6 libice6 libsm6 libfontconfig1 libxrandr2 libxi6 libxcursor1 libgl1 fonts-dejavu-core
          fi
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Self-test (headless)
        run: |
          chmod +x BloxCode-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./BloxCode-x86_64.AppImage --self-test
      - name: UI smoke test
        run: APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 xvfb-run -a ./BloxCode-x86_64.AppImage --self-test --ui

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, distros]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; title = $0; sub(/^## [^ ]+ *(— )?/, "", title); print title > "title.txt"; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > changes.md
          test -s changes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo "### Baixar"
            echo
            echo "| Sistema | Arquivo |"
            echo "| --- | --- |"
            echo "| **Windows** 10/11 | [BloxCode.exe]($base/BloxCode.exe) |"
            echo "| **Linux** (Arch, CachyOS, Ubuntu, Mint, Debian…) | [BloxCode-x86_64.AppImage]($base/BloxCode-x86_64.AppImage) |"
            echo
            echo "Quem já tem o Blox Code instalado recebe esta versão sozinho, com o arquivo do próprio sistema."
            echo
            # Signed releases must credit SignPath (a condition of the free certificate).
            if [ -n "$SIGNPATH_ORGANIZATION_ID" ]; then
              echo "\`BloxCode.exe\` is signed. Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
              echo
            fi
            echo "[Code signing policy](https://github.com/${GITHUB_REPOSITORY}#code-signing-policy) · [Privacy](https://github.com/${GITHUB_REPOSITORY}#privacy)"
            echo
            echo "### O que mudou"
            cat changes.md
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$GITHUB_REF_NAME"
          [ -s title.txt ] && title="$GITHUB_REF_NAME — $(cat title.txt)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/BloxCode.exe dist/BloxCode-x86_64.AppImage --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/BloxCode.exe dist/BloxCode-x86_64.AppImage --title "$title" --notes-file notes.md
          fi
